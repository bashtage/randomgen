name: Windows ARM64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: windows-11-arm, Python ${{ matrix.python }}
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # There is no ARM64 build of Python 3.10 for Windows.
        python: ["3.11", "3.15", "3.14t"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64

      - name: Show the Python platform
        run: python -c "import platform, sys, sysconfig; print(sys.version); print(platform.machine(), sysconfig.get_platform())"

      - name: Build and install randomgen
        # --vsenv activates the native ARM64 MSVC toolchain
        run: python -m pip install -v . -Csetup-args=--vsenv

      - name: Install test requirements
        # pip 25.1 or later is needed for --group
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test

      - name: Run tests
        # Run outside the checkout so that the installed package is tested.
        working-directory: ${{ runner.temp }}
        run: python -c "import randomgen; randomgen.test(['--skip-slow', '-n', 'auto', '-rfE', '--durations=10'])"

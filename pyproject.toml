[build-system]
build-backend = 'mesonpy'
requires = [
    'meson-python',
    "cython>=3.1.0,<4",  # Sync with the Cython check in meson.build
    "numpy>=2.0.0,<3",
    "setuptools-scm>=9.2.0,<10",
]

[project]
name = "randomgen"
# Keep synced with the build dependency group
dependencies = [
  # NumPy 2.4.0 removed SeedlessSequence, so builds against NumPy <= 2.3 or
  # 2.4.1+ fail to import on it (#426). NumPy 2.4.1 restored it.
  "numpy>=1.26,!=2.4.0,<3",
]
authors = [{ name = "Kevin Sheppard", email = "kevin.k.sheppard@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: C",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Artistic Software",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
]
description = "Random generator supporting multiple PRNGs"
dynamic = [
  'version'
]
keywords = [
    "pseudo random numbers",
    "PRNG",
    "RNG",
    "RandomState",
    "random",
    "random numbers",
    "parallel random numbers",
    "PCG",
    "XorShift",
    "dSFMT",
    "MT19937",
    "Random123",
    "ThreeFry",
    "Philox",
    "ChaCha",
    "AES",
    "SPECK",
    "RDRAND",
]
license = "NCSA OR BSD-3-Clause"
# The third-party code in randomgen/src carries its own license files, which
# must accompany the compiled extensions (the sources are no longer installed)
license-files = [ "LICENSE.md", "randomgen/src/*/LICENSE.md" ]
maintainers = [
  { name = "Kevin Sheppard", email = "kevin.k.sheppard@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
homepage = "https://github.com/bashtage/randomgen"
documentation = "https://bashtage.github.io/randomgen/"
repository = "https://github.com/bashtage/randomgen"
issues = "https://github.com/bashtage/randomgen/issues"
changelog = "https://bashtage.github.io/randomgen/change-log.html"

# Development dependencies (PEP 735). Install them with pip 25.1 or later, for
# example "python -m pip install --group dev" for everything needed to build,
# test and lint, or "python -m pip install --group dev --group doc" to also
# build the documentation.
[dependency-groups]
# Everything needed for "pip install -e . --no-build-isolation"
build = [
  "cython>=3.1.0,<4",  # Sync with the Cython check in meson.build
  "meson>=1.9.0",  # Sync with meson_version in meson.build
  "meson-python",
  "ninja",
  "numpy>=1.26,!=2.4.0,<3",
  "setuptools-scm>=9.2.0,<10",
]
test = [
  "pytest>=9",
  "pytest-cov",
  "pytest-randomly",
  "pytest-xdist",
  "scipy>=1.13.1",
]
lint = [
  "black[jupyter]~=26.10.1",
  "isort~=9.0",
  "mypy>=1.3",
  "ruff>=0.17.3",
]
doc = [
  "ipython>=8",
  "nbsphinx",
  "numba>=0.49",
  "pickleshare",
  "sphinx>=8",
  "sphinx-immaterial",
  "pygments>=2.7.4",  # not directly required, pinned by Snyk to avoid a vulnerability
  "requests>=2.32.4",  # not directly required, pinned by Snyk to avoid a vulnerability
]
dev = [
  { include-group = "build" },
  { include-group = "test" },
  { include-group = "lint" },
  # Used by the PractRand and seed-correlation tools in tools/
  "jinja2",
  "joblib",
  "zipp>=3.19.1",  # not directly required, pinned by Snyk to avoid a vulnerability
]

[tool.setuptools_scm]
version_file = "randomgen/_version.py"

# black and ruff take their target Python versions from requires-python
[tool.black]
exclude = '''
(
  \.egg
  | \.git
  | \.mypy_cache
  | \.oytest_cache
  | _build
  | buck-out
  | build
  | dist
)
'''

[tool.pyright]
exclude = [
  "**/tests/**",
]

[tool.ruff]
line-length = 88
fix = false

[tool.ruff.lint]
typing-modules = []

select = [
  "ALL",
  # pyflakes
  "F",
  # pycodestyle
  "E", "W",
  # flake8-2020
  "YTT",
  # flake8-bugbear
  "B",
  # flake8-quotes
  "Q",
  # flake8-debugger
  "T10",
  # flake8-gettext
  "INT",
  # pylint
  "PL",
  # flake8-pytest-style
  "PT",
  # misc lints
  "PIE",
  # flake8-pyi
  "PYI",
  # tidy imports
  "TID",
  # implicit string concatenation
  "ISC",
  # flake8-type-checking
  "TC",
  # comprehensions
  "C4",
  # pygrep-hooks
  "PGH",
  # Ruff-specific rules
  "RUF",
  # flake8-bandit: exec-builtin
  "S102",
  # Perflint
  "PERF",
  # flynt
  "FLY",
  # flake8-future-annotations
  "FA",
  # unconventional-import-alias
  "ICN001",
  # flake8-slots
  "SLOT",
  # flake8-raise
  "RSE"
]

ignore = [
  # Required to allow black formatting
  # Whitespace before ':' (Needed for black)
  "E203",
  # Line too long (### > 88 characters) (Needed for black)
  "E501",
  # Multiple statements on one line (colon) (E701)
  "E701",
  # Always ignore
  # TC do not work with doc building
  # Move application import `linearmodels....` into a type-checking block
  "TC001",
  # Move third-party import `...` into a type-checking block
  "TC002",
  # Move standard library import `...` into a type-checking block
  "TC003",
  # TODO: enable "PTH"
  "PTH",
  #  ### Intentionally disabled
  # Too many arguments to function call
  "PLR0913", # 55
  # Too many positional arguments to function call
  "PLR0917",
  # Missing copyright notice at the top of the file
  "CPY",
  # Too many branches
  "PLR0912", # 14
  # Too many statements
  "PLR0915", # 21
  # Magic number
  "PLR2004",
  # Like to suggest use [a, *b] instead of [a] + b
  "RUF005",
  # Logging issues with f-strings
  "G",
  # Commas interfere with black
  "COM",
  # Complains about asserts which are used in typing
  "S",
  # New temp ignores
  "FBT",
  "ANN",
  "D",
  "I",
  "RET",
  "BLE",
  "INP",
  "T",
  "SIM",
  "PD",
  "C901",
  "ERA",
  "LOG",
  "TRY",
  "EM",
  "A",
  "ARG",
  "SLF001",
  "NPY",
  "FIX",
  "TD",
  "EXE"
]

[tool.ruff.lint.per-file-ignores]
"tools/shared.py" = ["PT028"]


# Native TOML configuration, which needs pytest 9
[tool.pytest]
minversion = "9.0"
testpaths = ["randomgen"]
# strict_config, strict_markers, strict_xfail and strict_parametrization_ids
strict = true
empty_parameter_set_mark = "xfail"
filterwarnings = [
   "error:The covariance is not positive-semidefinite:RuntimeWarning",
   "ignore:the imp module:DeprecationWarning",
   "ignore:`np.long` is a deprecated:DeprecationWarning:numba.core.types",
   "error:`np.bool` is a deprecated alias:DeprecationWarning:",
   "error:Passing None into shape:DeprecationWarning:",
   "error:overflow encountered in scalar negative:RuntimeWarning",
   "error:matching against an empty::",
]
junit_family = "xunit2"
markers = [
  "slow: mark a test as slow"
]

[tool.isort]
profile = "black"
src_paths = ["randomgen"]
sections = ["FUTURE","STDLIB","THIRDPARTY","FIRSTPARTY","LOCALFOLDER"]
known_first_party = ["randomgen"]
known_third_party=["Cython","numpy","matplotlib","pandas","pytest","cython","scipy","seaborn"]
line_length=88
force_grid_wrap=0
multi_line_output=3
combine_as_imports=true
force_sort_within_sections=true
include_trailing_comma=true
use_parentheses=true

[tool.coverage.run]
source = [ "randomgen" ]
branch = true
plugins = [ "Cython.Coverage" ]
omit = [
  # Version file
  "*/_version.py",
  "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
ignore_errors = false
# Regexes for lines to exclude from consideration
exclude_also = [
  # Have to re-enable the standard pragma
  "pragma: no cover",

  # Do not complain about missing debug-only code:
  "def __repr__",
  "if self\\.debug",

  # Don't complain if tests don't hit defensive assertion code:
  "raise NotImplementedError",
  "except NotImplementedError",
  "raise AssertionError",
  # Ignore pass
  "pass",
  # Ignore failure messages
  "pytest.xfail",
  # Ignore ImportError protection
  "raise ImportError",
  "except ImportError",
  # Ignore type checking code
  "if TYPE_CHECKING",
  "elif TYPE_CHECKING",
  # Cython function declarations
  "cdef",
  # Cython functions with void
  "cdef void",
  # Numba jit decorators
  "@jit",
  # Do not complain if non-runnable code is not run:
  "if 0:",
  "if __name__ == .__main__.:",
]
include = [ "*/randomgen/*" ]
omit = [
  "*/_version.py",
  "*recursions.py",
  "*samplers.py",
]

[tool.coverage.html]
directory = "coverage_html_report"

[tool.mypy]
exclude = [
  "tests",
]
ignore_missing_imports=true
no_implicit_optional=true
strict_equality=true
disallow_untyped_defs=true
disallow_incomplete_defs=true
show_error_context=true

[[tool.mypy.overrides]]
module = ["randomgen.conftest", "randomgen._version"]
check_untyped_defs=false
disallow_untyped_defs=false

[[tool.mypy.overrides]]
module = "randomgen.tests.*"
check_untyped_defs=false
disallow_untyped_defs=false
disallow_incomplete_defs=false
